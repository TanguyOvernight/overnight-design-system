  :root{
    --bg-a:#2A1375; --bg-b:#18084F;
    --ink:#241B40; --ink2:#807A9C; --line:#EFECF9;
    --indigo:#4F38C0; --purple:#6C4FE0; --lav:#B9ACF4; --lav-soft:#E9E4FB;
    --mint:#46C9A0; --amber:#F0A93C; --coral:#FF7E8B; --blue:#4F86E0; --red:#E0392B;
    --white:#fff;
    --f:"Comfortaa",-apple-system,"Segoe UI",sans-serif;
    --d:"Baloo 2","Comfortaa",-apple-system,sans-serif;
    --b:"Nunito",-apple-system,sans-serif;
    --sh:0 12px 30px rgba(35,18,80,.22); --sh-card:0 8px 22px rgba(40,22,90,.10);
    --sh-soft:0 18px 44px rgba(34,18,80,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;min-height:100%;}
  /* Couleur de fond solide = iOS Safari teinte la status bar + la barre du bas en violet (plus de blanc) */
  html{background:#241064;}
  body{font-family:var(--b);background-color:#241064;
    background-image:linear-gradient(180deg,#2A1375 0%,#34108D 45%,#18084F 100%);
    background-repeat:no-repeat;background-size:cover;
    display:flex;justify-content:center;min-height:100dvh;}
  #app{position:relative;width:100%;max-width:460px;height:100dvh;min-height:100dvh;background:
    radial-gradient(120% 55% at 50% 6%,rgba(123,87,242,.28),transparent 60%),
    linear-gradient(180deg,#2A1375 0%,#34108D 45%,#18084F 100%);
    color:#fff;display:flex;flex-direction:column;overflow:hidden;}
  .pad{position:relative;z-index:1;padding:max(20px,env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column;min-height:0;}
  h1{font-family:var(--d);font-weight:800;letter-spacing:-.4px;line-height:1.05;}
  h2{font-family:var(--d);font-weight:700;letter-spacing:-.2px;line-height:1.15;}
  .cap{font-family:var(--b);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:11px;color:rgba(255,255,255,.6);}
  .sub{font-family:var(--b);font-weight:500;color:rgba(255,255,255,.82);line-height:1.5;}
  .spacer{flex:1;}.row{display:flex;gap:12px;}.center{align-items:center;text-align:center;}
  .hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .iconbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff;font-size:20px;flex:none;}
  .pill{font-family:var(--f);font-weight:700;font-size:12px;background:rgba(255,255,255,.16);padding:8px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;}
  .card{background:#fff;border-radius:22px;box-shadow:var(--sh-card);color:var(--ink);}
  .panel{background:#fff;border-radius:26px;box-shadow:var(--sh-soft);color:var(--ink);}
  .gpanel{background:linear-gradient(180deg,rgba(120,82,232,.46),rgba(48,28,116,.32));border:1px solid rgba(255,255,255,.13);border-radius:26px;color:#fff;box-shadow:0 14px 34px rgba(16,8,48,.28),inset 0 1px 0 rgba(255,255,255,.10);}
  .gpanel .cap{color:rgba(255,255,255,.72);}
  .gpanel .sub{color:rgba(255,255,255,.82) !important;}
  @keyframes pmuPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .gamebody{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:2px 0 14px;gap:12px;}
  .pcard{background:linear-gradient(135deg,#7C63EC,#5E46CC);border-radius:22px;box-shadow:var(--sh);}
  button{font-family:var(--f);cursor:pointer;border:none;}
  .btn{width:100%;min-height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--d);font-weight:800;font-size:18px;color:#fff;background:linear-gradient(180deg,#9D62FF,#6E3FDB);box-shadow:0 12px 24px rgba(70,40,160,.35),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .08s,box-shadow .2s,background .2s;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(180deg,#A878FF,#7A4DF0);color:#fff;box-shadow:0 14px 28px rgba(90,55,200,.42),inset 0 1px 0 rgba(255,255,255,.22);}
  .btn.indigo{background:var(--indigo);box-shadow:0 10px 24px rgba(79,56,192,.45);}
  .btn.red{background:linear-gradient(180deg,#FF6B5A,#E0392B);}
  .btn.dark{background:#16161F;}
  .btn.amber{background:#FFC93C;color:#3A2A06;}
  .btn.sm{min-height:50px;font-size:15px;}
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f);font-weight:700;color:#fff;flex:none;}
  .input{width:100%;height:56px;border-radius:16px;background:rgba(255,255,255,.16);border:none;padding:0 18px;font-family:var(--f);font-weight:600;font-size:17px;color:#fff;}
  .input::placeholder{color:rgba(255,255,255,.5);}
  .input:focus{outline:none;box-shadow:0 0 0 3px rgba(79,56,192,.16);}
  .playcard{background:#fff;border-radius:14px;box-shadow:0 14px 28px rgba(24,12,62,.28);display:flex;align-items:center;justify-content:center;position:relative;color:#16161F;font-family:var(--f);font-weight:800;overflow:hidden;}
  .playcard:before{content:"";position:absolute;inset:8px;border:1px solid #EEE9FA;border-radius:10px;pointer-events:none;}
  .playcard:after{content:"";position:absolute;width:42%;height:42%;border-radius:999px;background:currentColor;opacity:.08;right:-12%;bottom:-10%;pointer-events:none;}
  .playcard .ci{position:absolute;font-family:var(--f);font-weight:700;}
  .back{background:#fff url('assets/dos-carte.png') center/cover no-repeat !important;border:none !important;}
  .back:after{display:none !important;}
  .back:before{display:none !important;}
  .chip{min-width:38px;height:46px;padding:0 6px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-family:var(--f);font-weight:700;font-size:16px;color:#fff;}
  .chip:active{transform:scale(.94);}
  .gamerow{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;border-radius:18px;transition:background .18s,transform .08s;}
  .gamerow:active{transform:scale(.985);}
  .gtile{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--f);font-weight:800;font-size:20px;color:#fff;box-shadow:inset 0 -10px 18px rgba(35,18,80,.12);}
  .navdock{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:#fff;border-radius:24px;padding:8px;box-shadow:0 14px 34px rgba(25,12,72,.22);color:var(--ink2);}
  .navitem{height:50px;border-radius:18px;background:transparent;color:var(--ink2);font-family:var(--b);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .navitem.active{background:var(--lav-soft);color:var(--indigo);}
  .navicon{display:flex;align-items:center;justify-content:center;height:22px;}
  .score-banner{background:linear-gradient(135deg,#FFB07D,#FF7E8B);border-radius:20px;padding:14px 16px;color:#fff;box-shadow:0 12px 26px rgba(160,72,108,.24);font-family:var(--f);font-weight:800;}
  .podium{height:210px;position:relative;margin:18px 0 4px;}
  .pod{position:absolute;bottom:0;width:30%;border-radius:20px 20px 12px 12px;color:#fff;text-align:center;font-family:var(--f);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 14px 30px rgba(38,20,90,.2);}
  .pod.one{left:35%;height:134px;background:linear-gradient(180deg,#A98BFF,#7C63EC);}
  .pod.two{left:3%;height:104px;background:linear-gradient(180deg,#FFB37E,#F08E49);}
  .pod.three{right:3%;height:88px;background:linear-gradient(180deg,#FFE28A,#F0A93C);}
  .podplayer{position:absolute;transform:translateX(-50%);text-align:center;color:#fff;font-family:var(--f);font-weight:800;font-size:12px;}
  .palm-stage{position:relative;height:252px;width:100%;perspective:720px;}
  .palm-target{position:absolute;left:50%;bottom:132px;width:92px;height:10px;margin-left:-46px;border-radius:99px;background:rgba(255,201,60,.92);box-shadow:0 0 0 10px rgba(255,201,60,.14);}
  .bottle{position:absolute;bottom:0;left:50%;width:72px;height:132px;margin-left:-36px;border-radius:18px 18px 20px 20px;background:linear-gradient(160deg,#57D6AD 0%,#2BA17C 48%,#12634B 100%);box-shadow:inset -12px 0 0 rgba(0,0,0,.10),0 16px 26px rgba(19,54,56,.22);}
  .bottle:before{content:"";position:absolute;bottom:126px;left:22px;width:28px;height:34px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#2BA17C,#16664D);}
  .bottle:after{content:"";position:absolute;top:14px;left:14px;width:10px;height:76px;border-radius:999px;background:rgba(255,255,255,.22);}
  .palm-card{position:absolute;left:50%;width:62px;height:40px;margin-left:-31px;border-radius:8px;background:#fff;box-shadow:0 6px 12px rgba(24,12,62,.18);border:1px solid #F1ECFA;transform-style:preserve-3d;}
  .palm-card:after{content:"";position:absolute;inset:7px;border:1px solid #EEE9FA;border-radius:5px;}
  .swing-card{position:absolute;left:50%;width:76px;height:104px;margin-left:-38px;border-radius:12px;background:#fff;box-shadow:0 18px 30px rgba(24,12,62,.32);border:1px solid #EEE9FA;will-change:transform;transform:translateX(0) rotateX(58deg) rotateZ(-7deg);transform-origin:center 80%;}
  .swing-card:before{content:"A";position:absolute;top:10px;left:10px;font-family:var(--f);font-weight:800;color:var(--red);}
  .swing-card:after{content:"♦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--red);}
  .fade{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .pop{animation:pop .3s cubic-bezier(.2,1.3,.5,1);}
  @keyframes pop{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:none;}}
  /* Retournement de carte révélée — donne la sensation de "tirage" */
  .cflip{animation:cflip .52s cubic-bezier(.2,.8,.25,1) both;transform-origin:center;will-change:transform;}
  @keyframes cflip{0%{transform:perspective(900px) rotateY(-92deg) scale(.9);opacity:0;}55%{opacity:1;}70%{transform:perspective(900px) rotateY(8deg) scale(1.02);}100%{transform:perspective(900px) rotateY(0) scale(1);opacity:1;}}
  /* Résultat qui "tombe" avec un léger rebond */
  .drop{animation:drop .42s cubic-bezier(.2,1.2,.4,1) both;}
  @keyframes drop{0%{opacity:0;transform:translateY(-14px) scale(.96);}70%{transform:translateY(2px) scale(1);}100%{opacity:1;transform:none;}}

/* ============================ LE BUS ============================ */
function startBus(){ S.game={phase:'setup', deck:newDeck(), mode:'normal', step:1, cards:[], players:null}; S.reveal=null; go('bus'); }
function busSetMode(m){ const g=S.game; g.mode=m; if(m==='partage') g.players=S.players.map(()=>({step:1,cards:[]})); g.phase='play'; S.reveal=null; render(); }
function busProg(){ const g=S.game; return g.mode==='partage' ? g.players[S.turn] : g; }
SCREENS.bus = () => {
  const g=S.game;
  if(g.phase==='setup'){
    const modeBtn=(m,t,d)=>`<button onclick="busSetMode('${m}')" style="border:none;cursor:pointer;border-radius:18px;background:var(--lav-soft);padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:3px;">
      <span style="font-family:var(--d);font-weight:800;font-size:18px;color:var(--indigo);">${t}</span>
      <span style="font-family:var(--b);font-weight:600;font-size:13px;color:var(--ink2);line-height:1.35;">${d}</span></button>`;
    const mid=`<div class="gpanel" style="padding:24px;text-align:center;"><h2 style="font-size:22px;color:#fff;">Mode de jeu</h2>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:18px;">
       ${modeBtn('partage','Chacun son tour','1 carte par tour, à plusieurs. Tu gardes ta progression même en ratant (tu bois juste). La partie finit quand chaque joueur a fait ses 4 cartes.')}
       ${modeBtn('infini','Recommencer','Solo, sans pitié : le moindre rate te renvoie à l’étape 1. Tu gardes le téléphone jusqu’à réussir les 4 d’affilée.')}
       ${modeBtn('normal','Solo','Tu enchaînes les 4 étapes seul. Rate l’étape 1 = tu rejoues ; rate après = tu bois et ça passe au suivant.')}
      </div></div>`;
    return `<div class="pad fade">${gameHead('Le Bus')}${turnBanner()}<div class="gamebody">${mid}</div></div>`;
  }
  const p=busProg(), r=S.reveal;
  const dots=[1,2,3,4].map(n=>`<span style="width:30px;height:8px;border-radius:99px;background:${n<=p.step?'#FFC93C':'rgba(255,255,255,.25)'}"></span>`).join('');
  const prompts={1:'Rouge ou Noir ?',2:'Plus ou moins ?',3:'Intérieur ou extérieur ?',4:"Quelle enseigne ?"};
  let mid='', actions='';
  const prev = r ? p.cards.slice(0,-1) : p.cards;
  const stack = prev.length ? `<div style="display:flex;align-items:center;justify-content:center;margin-bottom:16px;">${prev.map((c,i)=>`<div style="margin-left:${i?-16:0}px;">${cardHTML(c,48,67)}</div>`).join('')}</div>` : '';
  if(r){
    const label = r.ok ? (p.step>=4?'Bravo !':(g.mode==='partage'?'Au joueur suivant':'Continuer')) : 'Au joueur suivant';
    actions = `<button class="btn primary" onclick="busNext()">${label}</button>`;
    mid = `<div class="gpanel" style="padding:24px;text-align:center;">${stack}
        <div class="cflip" style="display:flex;justify-content:center;">${cardHTML(r.card,168,236)}</div>
        <div class="drop" style="margin-top:18px;"><b style="font-family:var(--f);font-size:21px;color:${r.ok?'#7BE8C0':'#FF9A8B'};">${r.ok?'Gagné !':'Raté'}</b>
        <div class="sub" style="font-size:14px;margin-top:4px;">${r.msg}</div></div></div>`;
  } else {
    mid = `<div class="gpanel" style="padding:24px;text-align:center;">${stack}
        <div style="display:flex;justify-content:center;">${cardBack(192,268)}</div>
        <h2 style="font-size:24px;margin-top:18px;color:#fff;">${prompts[p.step]}</h2>
        <div class="sub" style="margin-top:4px;">Erreur = ${p.step} gorgée${p.step>1?'s':''}</div></div>`;
    if(p.step===1) actions=`<div class="row"><button class="btn red" onclick="busGuess('r')">Rouge</button><button class="btn dark" onclick="busGuess('n')">Noir</button></div>`;
    else if(p.step===2) actions=`<div class="row"><button class="btn" onclick="busGuess('p')">Plus ↑</button><button class="btn" onclick="busGuess('m')">Moins ↓</button></div>`;
    else if(p.step===3) actions=`<div class="row"><button class="btn" onclick="busGuess('in')">Intérieur</button><button class="btn" onclick="busGuess('out')">Extérieur</button></div>`;
    else actions=`<div class="row" style="flex-wrap:wrap;">${SUITS.map((s,i)=>`<button class="btn" style="flex:1 1 40%;color:${i===1||i===2?'#FFD2CC':'#fff'};" onclick="busGuess(${i})">${s}</button>`).join('')}</div>`;
  }
  const tag = g.mode==='partage'?'Partagé':(g.mode==='infini'?'Infini':'Normal');
  return `<div class="pad fade">${gameHead('Le Bus', `<div class="pill">${p.step}/4 · ${tag}</div>`)}
    ${turnBanner()}
    <div style="display:flex;justify-content:center;gap:7px;margin-bottom:6px;">${dots}</div>
    <div class="gamebody">${mid}</div>${actions}</div>`;
};
function busGuess(ans){
  const g=S.game, p=busProg(), c=draw(g.deck); let ok=false, msg='';
  if(p.step===1){ ok=(ans==='r')===isRed(c); msg=ok?'Bien vu, on continue.':`C'était ${isRed(c)?'rouge':'noir'}. Bois 1 gorgée.`; }
  else if(p.step===2){ const pr=p.cards[0]; if(c.v===pr.v){ok=false;msg='Égalité = perdu. Bois 2 gorgées.';} else { ok=(ans==='p')===(c.v>pr.v); msg=ok?'Exact !':'Raté. Bois 2 gorgées.'; } }
  else if(p.step===3){ const lo=Math.min(p.cards[0].v,p.cards[1].v), hi=Math.max(p.cards[0].v,p.cards[1].v); if(c.v===lo||c.v===hi){ok=false;msg='Pile sur une borne = perdu. Bois 3 gorgées.';} else { const inside=c.v>lo&&c.v<hi; ok=(ans==='in')===inside; msg=ok?'Bien joué !':'Raté. Bois 3 gorgées.'; } }
  else { ok=ans===c.s; msg=ok?'Incroyable, carton plein !':`C'était ${SUITS[c.s]}. Bois 4 gorgées.`; }
  if(!ok) drink(S.turn, p.step);
  S.reveal={card:c, ok, msg}; p.cards.push(c); render();
}
function busNext(){
  const g=S.game, p=busProg(), ok=S.reveal.ok; S.reveal=null;
  if(g.mode==='partage'){
    p.step++;                       // on avance qu'on ait gagné OU perdu — la progression est gardée
    if(g.players.every(pl=>pl.step>4)){ alert('Partie terminée — chaque joueur a fait ses 4 cartes !'); go('scores'); return; }
    for(let k=0;k<S.players.length;k++){ nextTurn(); if(g.players[S.turn].step<=4) break; } // passe au prochain pas encore arrivé au bout
    render(); return;
  }
  if(ok){
    p.step++;
    if(p.step>4){ alert(cur().name+' a réussi le Bus ! Distribue 4 gorgées à qui tu veux.'); p.step=1; p.cards=[]; nextTurn(); render(); return; }
    render();
  } else {
    if(g.mode==='infini'){ p.step=1; p.cards=[]; render(); }
    else { // normal solo : il faut passer l'étape 1 pour avancer
      if(p.step===1){ p.cards=[]; render(); }              // rate l'étape 1 -> on recommence, reste sur toi
      else { p.step=1; p.cards=[]; nextTurn(); render(); } // rate une étape ≥2 -> passe au suivant
    }
  }
}

function palmierRule(c){
  const v=c.v, red=isRed(c);
  if(v===1) return ['As — Cupidon','Forme un binôme avec qui tu veux : cette personne boit chaque fois que tu bois (et inversement) jusqu’au prochain As.'];
  if(v>=2&&v<=5) return [VN[v]+(red?' — Rouge : distribue':' — Noir : prends'), red?('Tu distribues '+v+' gorgées.'):('Tu prends '+v+' gorgées.')];
  if(v===6) return ['6 — Histoire','Raconte une histoire vraie ou fausse. Les autres devinent si tu mens.'];
  if(v===7) return ['7 — Dans ma valise','« Dans ma valise je mets… » Chacun répète et ajoute un objet. Qui oublie boit.'];
  if(v===8) return ['8 — Thème','Lance un thème. Chacun cite à tour de rôle. Qui sèche boit.'];
  if(v===9) return ['9 — Invente une règle','Crée une règle valable toute la partie.'];
  if(v===10) return ['10 — Action ou vérité','Au choix : action ou vérité.'];
  if(v===11) return ['Valet — Voisin','2 gorgées pour ton voisin de droite.'];
  if(v===12) return ['Dame — Tournée','1 gorgée pour tout le monde !'];
  return ['Roi — Bouffon','Choisis un bouffon : il prendra tes gorgées jusqu’au prochain roi.'];
}
function startPalmier(){ S.game={deck:newDeck(), stack:0, card:null, phase:'setup', balance:true, bx:0, dir:1, res:null}; go('palmier'); }
function palmTol(stack){ return Math.max(0.16, 0.30 - stack*0.012); }
function palmierScene(g){
  let cards=''; for(let i=0;i<g.stack;i++){
    const rot=(i%2?1:-1)*(5+i*1.7); const y=134+i*9;
    cards+=`<div class="palm-card" style="bottom:${y}px;transform:rotateX(58deg) rotateZ(${rot}deg);"></div>`;
  }
  let zone='', swing='';
  if(g.phase==='balance'){
    const tol=palmTol(g.stack), zw=Math.round(2*tol*120), y=118+g.stack*9;
    zone=`<div style="position:absolute;left:50%;bottom:${y}px;width:${zw}px;height:120px;margin-left:-${zw/2}px;border-radius:16px;background:rgba(25,169,116,.14);border:2px dashed rgba(25,169,116,.65);"></div>`;
    swing=`<div id="swing" class="swing-card" style="bottom:${154+g.stack*9}px;"></div>`;
  }
  return `<div class="palm-stage">${zone}<div class="bottle"></div>${cards}${swing}</div>`;
}
SCREENS.palmier = () => {
  const g=S.game; let mid, actions;
  if(g.phase==='setup'){
    mid=`<div class="gpanel" style="padding:28px 24px;text-align:center;">
       <h2 style="font-size:23px;color:#fff;">Mini-jeu d'équilibre ?</h2>
       <div class="sub" style="margin-top:12px;">Avec : après chaque carte, pose-la en équilibre sur le palmier (rate = 3 gorgées). Sans : on applique seulement les règles des cartes.</div>
       <div class="row" style="margin-top:22px;"><button class="btn" onclick="palmSetBalance(true)">Avec</button><button class="btn dark" onclick="palmSetBalance(false)">Sans</button></div></div>`;
    return `<div class="pad fade">${gameHead('Palmier')}${turnBanner()}<div class="gamebody">${mid}</div></div>`;
  }
  if(g.phase==='draw'){
    mid=`<div class="gpanel" style="padding:16px;">${palmierScene(g)}</div><div class="sub center" style="margin-top:10px;">${g.balance?('Palmier : '+g.stack+' carte'+(g.stack>1?'s':'')+' en équilibre.'):'Tire une carte et applique sa règle.'}</div>`;
    actions=`<button class="btn primary" onclick="palmierTirer()">Tirer une carte</button>`;
  } else if(g.phase==='rule'){
    const r=palmierRule(g.card);
    mid=`<div class="cflip" style="display:flex;justify-content:center;">${cardHTML(g.card,166,232)}</div>
      <div class="drop gpanel" style="margin-top:18px;padding:18px;text-align:center;"><b style="font-family:var(--f);font-size:19px;color:#fff;">${r[0]}</b>
      <div class="sub" style="font-size:14px;margin-top:5px;">${r[1]}</div></div>`;
    actions=g.balance ? `<button class="btn amber" onclick="palmierBalance()">Poser sur le palmier</button>` : `<button class="btn primary" onclick="palmierNext()">Au joueur suivant</button>`;
  } else if(g.phase==='balance'){
    mid=`<div class="gpanel" style="padding:16px;">${palmierScene(g)}</div><div class="sub center" style="font-family:var(--f);font-weight:700;margin-top:10px;">Pose quand la carte est <span style="color:#7BE8C0;">verte</span> (dans la zone) !</div>`;
    actions=`<button class="btn amber" onclick="palmierDrop()">POSER</button>`;
  } else {
    mid=`<div class="gpanel" style="padding:16px;">${palmierScene(g)}</div><div class="gpanel" style="margin-top:12px;padding:16px;text-align:center;"><b style="font-family:var(--f);font-size:18px;color:${g.res.ok?'#7BE8C0':'#FF9A8B'};">${g.res.title}</b><div class="sub" style="font-size:14px;margin-top:4px;">${g.res.msg}</div></div>`;
    actions=`<button class="btn primary" onclick="palmierNext()">Au joueur suivant</button>`;
  }
  return `<div class="pad fade">${gameHead('Palmier', `<div class="pill">Palmier ${g.stack}</div>`)}${turnBanner()}<div class="gamebody">${mid}</div>${actions}</div>`;
};
function palmSetBalance(on){ S.game.balance=on; S.game.phase='draw'; render(); }
function palmierTirer(){ S.game.card=draw(S.game.deck); S.game.phase='rule'; render(); }
function palmierBalance(){ const g=S.game; g.phase='balance'; g.bx=0; g.dir=1; render(); startSwing(); }
function startSwing(){
  if(S.timer) clearInterval(S.timer);
  S.timer=setInterval(()=>{ const g=S.game; if(!g||g.phase!=='balance'){clearInterval(S.timer);S.timer=null;return;}
    g.bx+=g.dir*0.04; if(g.bx>=1){g.bx=1;g.dir=-1;} if(g.bx<=-1){g.bx=-1;g.dir=1;}
    const el=document.getElementById('swing'); if(!el){ clearInterval(S.timer); S.timer=null; return; }
    const inZone=Math.abs(g.bx)<palmTol(g.stack);
    el.style.transform='translateX('+(g.bx*120)+'px) rotateX(58deg) rotateZ('+(-7 + g.bx*8)+'deg)';
    el.style.background=inZone?'linear-gradient(180deg,#7BE8C0,#19A974)':'#fff';
    el.style.boxShadow=inZone?'0 0 0 4px rgba(25,169,116,.4),0 18px 30px rgba(25,169,116,.5)':'0 18px 30px rgba(24,12,62,.32)';
  },16);
}
function palmierDrop(){
  if(S.timer){clearInterval(S.timer);S.timer=null;}
  const g=S.game, off=Math.abs(g.bx), tol=palmTol(g.stack);
  if(off<tol){ g.stack++; g.res={ok:true, title:'En équilibre !', msg:'La carte tient — palmier à '+g.stack+'. (Applique aussi la règle de ta carte.)'}; }
  else { drink(S.turn,3); g.res={ok:false, title:'Le palmier s’effondre !', msg:'Carte ratée : bois 3 gorgées. On repart de zéro.'}; g.stack=0; }
  g.phase='result'; render();
}
function palmierNext(){ const g=S.game; nextTurn(); g.phase='draw'; g.card=null; g.res=null; render(); }

/* ============================ VÉRITÉ OU BOIS ============================ */
const VOB_CATS=[{id:'tout',label:'Tout'},{id:'soft',label:'Soft'},{id:'amis',label:'Vieux frères'},{id:'chaud',label:'Chaud du cul'},{id:'probleme',label:'Les problèmes'},{id:'action',label:'Actions'}];
function startVob(){ S.game={phase:'setup', cat:'tout', used:new Set(), q:null, target:100, count:0}; go('vob'); }
function vobSetCat(c){ S.game.cat=c; render(); }
function vobSetCount(n){ const g=S.game; g.target=n; g.count=0; g.phase='play'; vobPick(); render(); }
// --- Ciblage par sexe (via l'avatar choisi) pour Vérité ou Bois ---
function sexOf(p){ return p && p.avatar && p.avatar.g; }
function vobOthers(){ return S.players.filter(p=>p!==cur()); }
function vobBySex(g,excludeCur){ return S.players.filter(p=>sexOf(p)===g && (!excludeCur || p!==cur())); }
function vobItem(x){ return typeof x==='string' ? {t:x} : x; }
function vobPlayable(it){
  if(it.who==='h' && sexOf(cur())!=='Homme') return false;
  if(it.who==='f' && sexOf(cur())!=='Femme') return false;
  if(it.need==='h' && vobBySex('Homme',false).length===0) return false;
  if(it.need==='f' && vobBySex('Femme',false).length===0) return false;
  const t=it.t;
  if(t.includes('{autre2}') && vobOthers().length<2) return false;
  else if(t.includes('{autre}') && vobOthers().length<1) return false;
  if(t.includes('{H}') && vobBySex('Homme',true).length===0) return false;
  if(t.includes('{F}') && vobBySex('Femme',true).length===0) return false;
  return true;
}
function vobFill(t){
  const others=shuffle([...vobOthers()]); const used=[];
  const isH=x=>sexOf(x)==='Homme', isF=x=>sexOf(x)==='Femme';
  function pick(filter){
    // 1) un AUTRE joueur pas encore utilisé qui respecte le filtre (sexe)
    let p=others.find(x=>!used.includes(x)&&(!filter||filter(x)));
    // 2) sans filtre, on peut réutiliser un autre joueur (jamais soi-même)
    if(!p && !filter) p=others.find(x=>!used.includes(x))||others[0];
    // (avec filtre et aucun autre du bon sexe → on renvoie null = texte générique, jamais soi-même ni le mauvais sexe)
    if(p) used.push(p); return p;
  }
  return t.replace(/\{autre2\}|\{autre\}|\{H\}|\{F\}/g, m=>{
    const p = m==='{H}'?pick(isH) : m==='{F}'?pick(isF) : pick();
    return p ? playerTag(p) : (m==='{F}'?'une meuf du groupe':m==='{H}'?'un gars du groupe':'quelqu’un ici');
  });
}
function vobKey(r,i){ return r+'-'+i; }
function qCats(rd,it){ const c=(it&&it.cat)||rd.cat; return Array.isArray(c)?c:[c]; }
function vobPool(cat){ const out=[]; VOB.forEach((rd,r)=>{ rd.q.forEach((q,i)=>{ const it=vobItem(q); if(cat!=='tout' && !qCats(rd,it).includes(cat)) return; if(vobPlayable(it)) out.push([r,i]); }); }); return out; }
function vobPick(){
  const g=S.game;
  let pool=vobPool(g.cat).filter(([r,i])=>!g.used.has(vobKey(r,i)));
  if(!pool.length){ g.used.clear(); pool=vobPool(g.cat); }
  if(!pool.length) pool=vobPool('tout');           // repli si le thème n'a rien de jouable ici
  if(!pool.length){ g.q=vobFill(vobItem(VOB[0].q[0]).t); return; }
  const [r,i]=pool[Math.random()*pool.length|0]; g.used.add(vobKey(r,i)); g.q=vobFill(vobItem(VOB[r].q[i]).t);
}
function rndPick(a){ return a[Math.random()*a.length|0]; }

   <div class="row"><button class="btn" onclick="vobAns(false)">Je bois (1)</button><button class="btn primary" onclick="vobAns(true)">Je le fais !</button></div>

function newParty(){ if(S.players.length<2)return; S.players.forEach(p=>p.gorgees=0); S.turn=0; go('hub'); }
// Session locale (par téléphone) : on garde les noms/avatars entre les parties et les rechargements
function saveSession(){ try{ localStorage.setItem('overnight.players', JSON.stringify(S.players.map(p=>({name:p.name,color:p.color,avatar:p.avatar||null})))); }catch(e){} }
function loadSession(){ try{ const j=localStorage.getItem('overnight.players'); if(j){ const a=JSON.parse(j); if(Array.isArray(a)) S.players=a.filter(p=>p&&p.name).map(p=>({name:p.name, color:p.color||COLORS[0], avatar:p.avatar||null, gorgees:0})); } }catch(e){} }
// Petite explosion festive (stars/confettis) — superposée à #app, auto-nettoyée
function burstConfetti(n){
  const host=app(); if(!host) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden;';
  const cols=['#FFDB4D','#FF6B5A','#38D7B5','#9D62FF','#fff'];
  for(let i=0;i<(n||20);i++){
    const s=document.createElement('span');
    const ang=Math.random()*Math.PI*2, dist=80+Math.random()*120;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-60;
    const sz=7+Math.random()*8, dur=720+Math.random()*520, delay=Math.random()*120;
    s.style.cssText=`position:absolute;top:40%;left:50%;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};border-radius:2px;--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;animation:confetti ${dur.toFixed(0)}ms cubic-bezier(.15,.7,.3,1) ${delay.toFixed(0)}ms forwards;`;
    wrap.appendChild(s);
  }
  host.appendChild(wrap);
  setTimeout(()=>wrap.remove(),1600);
}
function render(){ app().innerHTML = SCREENS[S.screen](); }
// Détection du clavier (iOS/Android) via visualViewport : libère de la place quand on tape un prénom
(function(){
  const vv=window.visualViewport, root=document.documentElement;
  function setKb(px){ root.style.setProperty('--kb',(px>0?px:0)+'px'); const a=app(); if(a) a.classList.toggle('kbopen', px>120); }
  function update(){ if(!vv) return; setKb(Math.round(window.innerHeight - vv.height - vv.offsetTop)); }
  if(vv){ vv.addEventListener('resize',update); vv.addEventListener('scroll',update); }
  window.addEventListener('focusin', e=>{ if(e.target&&e.target.tagName==='INPUT') setTimeout(update,60); });
  window.addEventListener('focusout', e=>{ if(e.target&&e.target.tagName==='INPUT') setTimeout(()=>setKb(0),80); });
})();
loadSession();
render();
</script>
</body>
